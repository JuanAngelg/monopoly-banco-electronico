// ═══════════════════════════════════════════════════════════════════════════
// PARTE 1: MÉTODO NUMÉRICO - AJUSTE POLINOMIAL
// ═══════════════════════════════════════════════════════════════════════════

/**
 * Eliminación Gaussiana con Pivoteo Parcial
 * Resuelve el sistema Ax = b mediante eliminación gaussiana
 * @param {number[][]} A - Matriz de coeficientes
 * @param {number[]} b - Vector de términos independientes
 * @returns {number[]} - Vector solución x
 */
function gaussianElimination(A, b) {
  const n = b.length;
  const matrix = A.map((row, i) => [...row, b[i]]);
  
  // Eliminación hacia adelante con pivoteo parcial
  for (let col = 0; col < n; col++) {
    // Encontrar pivote máximo en la columna actual
    let maxRow = col;
    for (let row = col + 1; row < n; row++) {
      if (Math.abs(matrix[row][col]) > Math.abs(matrix[maxRow][col])) {
        maxRow = row;
      }
    }
    
    // Intercambiar filas
    [matrix[col], matrix[maxRow]] = [matrix[maxRow], matrix[col]];
    
    // Evitar división por cero
    if (Math.abs(matrix[col][col]) < 1e-12) continue;
    
    // Hacer ceros debajo del pivote
    for (let row = col + 1; row < n; row++) {
      const factor = matrix[row][col] / matrix[col][col];
      for (let j = col; j <= n; j++) {
        matrix[row][j] -= factor * matrix[col][j];
      }
    }
  }
  
  // Sustitución hacia atrás
  const solution = Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    solution[i] = matrix[i][n];
    for (let j = i + 1; j < n; j++) {
      solution[i] -= matrix[i][j] * solution[j];
    }
    if (Math.abs(matrix[i][i]) > 1e-12) {
      solution[i] /= matrix[i][i];
    }
  }
  
  return solution;
}

/**
 * Ajuste Polinomial por Mínimos Cuadrados
 * Calcula los coeficientes del polinomio que mejor se ajusta a los datos
 * Resuelve: AᵀA·c = Aᵀb
 * @param {[number, number][]} points - Array de puntos [x, y]
 * @param {number} degree - Grado del polinomio (default: 2)
 * @returns {number[]|null} - Coeficientes [c0, c1, c2, ...] o null si no hay suficientes datos
 */
function polynomialFit(points, degree = 2) {
  if (points.length < degree + 1) return null;
  
  const n = points.length;
  const d = degree + 1; // Número de coeficientes
  
  // Construir matriz AᵀA (matriz normal)
  const AtA = Array.from({ length: d }, (_, i) =>
    Array.from({ length: d }, (_, j) =>
      points.reduce((sum, p) => sum + Math.pow(p[0], i + j), 0)
    )
  );
  
  // Construir vector Aᵀb
  const Atb = Array.from({ length: d }, (_, i) =>
    points.reduce((sum, p) => sum + Math.pow(p[0], i) * p[1], 0)
  );
  
  // Resolver el sistema de ecuaciones normales
  return gaussianElimination(AtA, Atb);
}

/**
 * Evalúa un polinomio en un punto dado
 * p(x) = c[0] + c[1]*x + c[2]*x² + ...
 * @param {number[]} coefficients - Coeficientes del polinomio
 * @param {number} x - Punto de evaluación
 * @returns {number} - Valor del polinomio en x
 */
function polynomialEval(coefficients, x) {
  if (!coefficients) return 0;
  return coefficients.reduce((sum, c, i) => sum + c * Math.pow(x, i), 0);
}

const SALARY = 200000;
const INIT_BALANCE = 15000000;
const RENT_UNIT_SCALE = 1000;

const PLAYERS_CONFIG = [
  {color:"#DC2626", token:"🚗", name:"Jugador 1"},
  {color:"#2563EB", token:"🎩", name:"Jugador 2"},
  {color:"#16A34A", token:"🐋", name:"Jugador 3"},
  {color:"#D97706", token:"🛥️", name:"Jugador 4"},
];

function getSpaceById(spaceId) {
  return BOARD.find(space => space.id === spaceId);
}

function getColorGroupSpaces(color) {
  return BOARD.filter(space => space.type === "prop" && space.color === color);
}

function countOwnedByType(playerId, type, properties) {
  return BOARD.filter(space => space.type === type && properties[space.id] === playerId).length;
}

function ownsColorGroup(playerId, color, properties, mortgaged) {
  const groupSpaces = getColorGroupSpaces(color);
  return groupSpaces.length > 0 && groupSpaces.every(space => properties[space.id] === playerId && !mortgaged[space.id]);
}

function nearestSpacePosition(startPos, matcher) {
  for (let step = 1; step <= 40; step++) {
    const candidate = (startPos + step) % 40;
    if (matcher(BOARD[candidate])) return candidate;
  }
  return startPos;
}

function movePlayerTo(player, targetPos, collectSalary = true) {
  const updated = {...player};
  if (collectSalary && !updated.inJail && targetPos < updated.pos) {
    updated.balance += SALARY;
  }
  updated.pos = targetPos;
  return updated;
}

function estimateAuctionBid(player, space, properties) {
  const cash = player.balance;

  if (space.type === "prop") {
    const groupSpaces = getColorGroupSpaces(space.color);
    const ownedCount = groupSpaces.filter(groupSpace => properties[groupSpace.id] === player.id).length;
    const monopolyChance = ownedCount === groupSpaces.length - 1 ? 1.45 : ownedCount > 0 ? 1.2 : 0.95;
    return Math.min(cash, Math.round(space.price * monopolyChance));
  }

  if (space.type === "rail") {
    const ownedCount = countOwnedByType(player.id, "rail", properties);
    return Math.min(cash, Math.round(space.price * (0.85 + ownedCount * 0.25)));
  }

  if (space.type === "util") {
    const ownedCount = countOwnedByType(player.id, "util", properties);
    return Math.min(cash, Math.round(space.price * (0.8 + ownedCount * 0.15)));
  }

  return Math.min(cash, Math.round(space.price * 0.5));
}

function runAuction(space, players, properties) {
  const reserve = Math.max(1, Math.round(space.price * 0.5));
  const bids = players
    .filter(player => !player.bankrupt && player.balance >= reserve)
    .map(player => ({player, bid: estimateAuctionBid(player, space, properties)}))
    .filter(entry => entry.bid >= reserve && entry.bid <= entry.player.balance)
    .sort((a, b) => b.bid - a.bid || a.player.id - b.player.id);

  if (!bids.length) {
    return {
      players,
      properties,
      logMessage: "🏷️ Subasta: nadie hizo una oferta por " + space.name + "."
    };
  }

  const winner = bids[0];
  const updatedPlayers = players.map(player =>
    player.id === winner.player.id ? {...player, balance: player.balance - winner.bid} : player
  );
  const updatedProperties = {...properties, [space.id]: winner.player.id};

  return {
    players: updatedPlayers,
    properties: updatedProperties,
    logMessage: "🏷️ Subasta: " + winner.player.token + " ganó " + space.name + " por " + formatMoney(winner.bid)
  };
}

function resolveLandingAfterMove(player, players, log, context) {
  const space = BOARD[player.pos];
  const currentPlayers = [...players];
  const addLog = msg => { log = [msg, ...log].slice(0, 40); };

  addLog(context + " → " + space.name);

  if (space.type === "go") {
    addLog(player.token + " cae en SALIDA → cobra " + formatMoney(SALARY) + "!");
    player.balance += SALARY;
    currentPlayers[GAME.currentPlayerIdx] = player;
    return {players: currentPlayers, log, gamePhase: GAME.turnDoublesCount > 0 ? "roll" : "end", pending: null};
  }

  if (space.type === "jail2") {
    player.pos = 10;
    player.inJail = true;
    player.jailTurns = 0;
    addLog(player.token + " va directo a la CÁRCEL por efecto de la carta.");
    currentPlayers[GAME.currentPlayerIdx] = player;
    return {players: currentPlayers, log, gamePhase: "end", pending: null, turnDoublesCount: 0};
  }

  if (space.type === "tax") {
    player.balance -= space.rent;
    addLog(player.token + " paga impuesto " + formatMoney(space.rent));
    currentPlayers[GAME.currentPlayerIdx] = player;
    return {players: currentPlayers, log, gamePhase: GAME.turnDoublesCount > 0 ? "roll" : "end", pending: null};
  }

  if (space.type === "prop" || space.type === "rail" || space.type === "util") {
    const ownerId = GAME.properties[space.id];
    if (ownerId === undefined) {
      addLog("📍 La carta dejó a " + player.token + " en " + space.name + " para compra o subasta.");
      currentPlayers[GAME.currentPlayerIdx] = player;
      return {players: currentPlayers, log, gamePhase: "buy_prompt", pending: space};
    }

    if (ownerId === player.id) {
      addLog(player.token + " cayó en su propia propiedad.");
      currentPlayers[GAME.currentPlayerIdx] = player;
      return {players: currentPlayers, log, gamePhase: GAME.turnDoublesCount > 0 ? "roll" : "end", pending: null};
    }

    if (GAME.mortgaged[space.id]) {
      addLog("⛔ " + space.name + " está hipotecada. No se cobra renta.");
      currentPlayers[GAME.currentPlayerIdx] = player;
      return {players: currentPlayers, log, gamePhase: GAME.turnDoublesCount > 0 ? "roll" : "end", pending: null};
    }

    let rentAmount = 0;
    if (space.type === "prop") {
      const monopolyBonus = ownsColorGroup(ownerId, space.color, GAME.properties, GAME.mortgaged) ? 2 : 1;
      rentAmount = Math.round(space.rent * RENT_UNIT_SCALE * GAME.inflationMultiplier * monopolyBonus);
    } else if (space.type === "rail") {
      const railCount = countOwnedByType(ownerId, "rail", GAME.properties);
      rentAmount = Math.round(space.rent * Math.pow(2, railCount - 1) * RENT_UNIT_SCALE * GAME.inflationMultiplier);
    } else if (space.type === "util") {
      const utilCount = countOwnedByType(ownerId, "util", GAME.properties);
      rentAmount = Math.round((GAME.diceRoll ? GAME.diceRoll[0] + GAME.diceRoll[1] : 0) * (utilCount === 1 ? 4 : 10) * RENT_UNIT_SCALE * GAME.inflationMultiplier);
    }

    player.balance -= rentAmount;
    const owner = {...currentPlayers.find(x => x.id === ownerId)};
    owner.balance += rentAmount;
    addLog(player.token + " paga renta " + formatMoney(rentAmount) + " a " + owner.token + " (inflación ×" + GAME.inflationMultiplier.toFixed(2) + ")");
    const updatedPlayers = currentPlayers.map(pl => pl.id === player.id ? player : pl.id === ownerId ? owner : pl);
    return {players: updatedPlayers, log, gamePhase: GAME.turnDoublesCount > 0 ? "roll" : "end", pending: null};
  }

  currentPlayers[GAME.currentPlayerIdx] = player;
  return {players: currentPlayers, log, gamePhase: GAME.turnDoublesCount > 0 ? "roll" : "end", pending: null};
}

function useJailFreeCard(player) {
  if (!player.jailFreeCards || player.jailFreeCards <= 0 || !player.inJail) return player;
  return {
    ...player,
    jailFreeCards: player.jailFreeCards - 1,
    inJail: false,
    jailTurns: 0
  };
}

function moveToNearestRailroad(player) {
  return movePlayerTo(player, nearestSpacePosition(player.pos, space => space.type === "rail"));
}

function moveToNearestUtility(player) {
  return movePlayerTo(player, nearestSpacePosition(player.pos, space => space.type === "util"));
}

function formatMoney(n) {
  const abs = Math.abs(n);
  const sign = n < 0 ? "-" : "";
  if (abs >= 1000000) return sign + "$" + (abs/1000000).toFixed(1) + "M";
  if (abs >= 1000) return sign + "$" + Math.round(abs/1000) + "K";
  return sign + "$" + abs;
}

function rollDice() {
  return Math.floor(Math.random() * 6) + 1;
}

function initGame(numPlayers) {
  return {

// PARTE 3: LÓGICA DEL MÉTODO NUMÉRICO
// ═══════════════════════════════════════════════════════════════════════════

/**
 * Actualiza el modelo económico del juego
 * Captura la riqueza promedio de jugadores activos cada ronda
 * Ajusta una curva polinomial y calcula el multiplicador de inflación
 * 
 * ENTRADA: Array de jugadores, número de ronda, datos históricos
 * SALIDA: nuevos datos, coeficientes del polinomio, multiplicador
 */
function updateEconomicModel(players, round, ecoData) {
  const activePlayers = players.filter(p => !p.bankrupt);
  if (activePlayers.length === 0) {
    return { newEcoData: ecoData, coeffs: null, multiplier: 1.0 };
  }
  
  // Calcular riqueza promedio
  const avgWealth = activePlayers.reduce((sum, p) => sum + p.balance, 0) / activePlayers.length;
  const newEcoData = [...ecoData, [round, avgWealth]];
  
  // Necesitamos al menos 3 puntos para ajustar un polinomio de grado 2
  if (newEcoData.length < 3) {
    return { newEcoData, coeffs: null, multiplier: 1.0 };
  }
  
  // Ajustar polinomio de grado 2
  const coeffs = polynomialFit(newEcoData, 2);
  if (!coeffs) {
    return { newEcoData, coeffs: null, multiplier: 1.0 };
  }
  
  // Calcular multiplicador de inflación
  // inflator = p(round) / p(1), con límites [1.0, 2.5]
  const baseValue = polynomialEval(coeffs, 1);
  const currentValue = polynomialEval(coeffs, round);
  const ratio = baseValue > 0 ? currentValue / baseValue : 1;
  const multiplier = Math.max(1.0, Math.min(2.5, ratio));
  
  return { newEcoData, coeffs, multiplier };
}

let GAME = null;
let SCREEN = "setup"; // setup | game | over
let NUM_PLAYERS = 2;

function processRoll() {
  if (GAME.gamePhase !== "roll") return;
  
  const d1 = rollDice();
  const d2 = rollDice();
  const steps = d1 + d2;
  
  let player = {...GAME.players[GAME.currentPlayerIdx]};
  let players = [...GAME.players];
  let log = [...GAME.log];
  let doublesCount = GAME.turnDoublesCount || 0;
  
  const addLog = msg => { log = [msg, ...log].slice(0, 40); };
  const isDouble = d1 === d2;
  let releasedFromJail = false;
  let nextPhase = "end";
  
  // Manejo de cárcel
  if (player.inJail) {
    if (isDouble) {
      addLog(player.token + " sacó dobles — ¡sale de la cárcel!");
      player.inJail = false;
      player.jailTurns = 0;
      releasedFromJail = true;
    } else {
      player.jailTurns++;
      if (player.jailTurns >= 3) {
        player.balance -= 500000;
        player.inJail = false;
        player.jailTurns = 0;
        addLog(player.token + " pagó $500K para salir de la cárcel.");
      } else {
        addLog(player.token + " sigue en cárcel (" + player.jailTurns + "/3). Dados: " + d1 + "+" + d2);
        players[GAME.currentPlayerIdx] = player;
        GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: "end", turnDoublesCount: 0, log};
        render();
        return;
      }
    }
  }
  
  // Movimiento
  const oldPos = player.pos;
  player.pos = (oldPos + steps) % 40;
  const passedGo = !player.inJail && player.pos < oldPos;
  
  if (passedGo) {
    player.balance += SALARY;
    addLog(player.token + " pasó por SALIDA → cobra " + formatMoney(SALARY) + "!");
  }

  if (isDouble && !releasedFromJail) {
    doublesCount += 1;
    if (doublesCount >= 3) {
      player.pos = 10;
      player.inJail = true;
      player.jailTurns = 0;
      doublesCount = 0;
      players[GAME.currentPlayerIdx] = player;
      addLog("🚨 " + player.token + " sacó tres dobles seguidos y va directo a la CÁRCEL.");
      GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: "end", turnDoublesCount: 0, log};
      render();
      return;
    }
    nextPhase = "roll";
    addLog(player.token + " sacó dobles y obtiene otro turno.");
  } else {
    doublesCount = 0;
  }
  
  const space = BOARD[player.pos];
  addLog(player.token + " " + player.name + ": " + d1 + "+" + d2 + "=" + steps + " → " + space.name);
  players[GAME.currentPlayerIdx] = player;
  
  // Procesar casilla según tipo
  switch(space.type) {
    case "go":
      if (!passedGo) {
        player.balance += SALARY;
        addLog(player.token + " en SALIDA → cobra " + formatMoney(SALARY) + "!");
      }
      players[GAME.currentPlayerIdx] = player;
      GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: nextPhase, turnDoublesCount: doublesCount, log};
      break;
    
    case "prop":
    case "rail":
    case "util": {
      const ownerId = GAME.properties[space.id];
      if (ownerId === undefined) {
        players[GAME.currentPlayerIdx] = player;
        GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: "buy_prompt", pending: space, log};
      } else if (ownerId === player.id) {
        addLog(player.token + " está en su propia propiedad.");
        GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: nextPhase, turnDoublesCount: doublesCount, log};
      } else {
        if (GAME.mortgaged[space.id]) {
          addLog("⛔ " + space.name + " está hipotecada. No se cobra renta.");
          GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: nextPhase, turnDoublesCount: doublesCount, log};
          break;
        }

        let rentAmount = 0;
        if (space.type === "prop") {
          const monopolyBonus = ownsColorGroup(ownerId, space.color, GAME.properties, GAME.mortgaged) ? 2 : 1;
          rentAmount = Math.round(space.rent * RENT_UNIT_SCALE * GAME.inflationMultiplier * monopolyBonus);
        } else if (space.type === "rail") {
          const railCount = countOwnedByType(ownerId, "rail", GAME.properties);
          rentAmount = Math.round(space.rent * Math.pow(2, railCount - 1) * RENT_UNIT_SCALE * GAME.inflationMultiplier);
        } else if (space.type === "util") {
          const utilCount = countOwnedByType(ownerId, "util", GAME.properties);
          rentAmount = Math.round(steps * (utilCount === 1 ? 4 : 10) * RENT_UNIT_SCALE * GAME.inflationMultiplier);
        }
        player.balance -= rentAmount;
        
        let owner = {...players.find(x => x.id === ownerId)};
        owner.balance += rentAmount;
        
        addLog(player.token + " paga renta " + formatMoney(rentAmount) + " a " + owner.token + 
               " (inflación ×" + GAME.inflationMultiplier.toFixed(2) + ")");
        
        players = players.map(pl =>
          pl.id === player.id ? player : pl.id === ownerId ? owner : pl
        );
        
        // Verificar quiebra
        if (player.balance < 0) {
          players = players.map(pl => pl.id === player.id ? {...pl, bankrupt: true} : pl);
          addLog("💥 " + player.token + " " + player.name + " ¡BANCARROTA!");
          const activePlayers = players.filter(x => !x.bankrupt);
          if (activePlayers.length === 1) {
            GAME = {...GAME, players, diceRoll: [d1, d2], winner: activePlayers[0], log};
            render();
            return;
          }
        }
        GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: nextPhase, turnDoublesCount: doublesCount, log};
      }
      break;
    }
    
    case "tax": {
      player.balance -= space.rent;
      players[GAME.currentPlayerIdx] = player;
      addLog(player.token + " paga impuesto " + formatMoney(space.rent));
      
      if (player.balance < 0) {
        players = players.map(pl => pl.id === player.id ? {...pl, bankrupt: true} : pl);
        addLog("💥 " + player.token + " ¡BANCARROTA!");
        const activePlayers = players.filter(x => !x.bankrupt);
        if (activePlayers.length === 1) {
          GAME = {...GAME, players, diceRoll: [d1, d2], winner: activePlayers[0], log};
          render();
          return;
        }
      }
      GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: nextPhase, turnDoublesCount: doublesCount, log};
      break;
    }
    
    case "chance": {
      const card = CHANCE_CARDS[Math.floor(Math.random() * CHANCE_CARDS.length)];
      SHOW_CARD_MODAL = true;
      CURRENT_CARD = {type: "🎴 Suerte", text: card.text, action: card.action};
      GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: "card_modal", log};
      render();
      return;
    }
    
    case "comm": {
      const card = COMM_CARDS[Math.floor(Math.random() * COMM_CARDS.length)];
      SHOW_CARD_MODAL = true;
      CURRENT_CARD = {type: "📦 C.Comunidad", text: card.text, action: card.action};
      GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: "card_modal", log};
      render();
      return;
    }
    
    case "jail2":
      player.pos = 10;
      player.inJail = true;
      player.jailTurns = 0;
      doublesCount = 0;
      players[GAME.currentPlayerIdx] = player;
      addLog(player.token + " ¡Va directo a la CÁRCEL!");
      GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: "end", turnDoublesCount: 0, log};
      break;
    
    default:
      GAME = {...GAME, players, diceRoll: [d1, d2], gamePhase: nextPhase, turnDoublesCount: doublesCount, log};
  }
  
  render();
}

function processBuy(shouldBuy) {
  const space = GAME.pending;
  let player = {...GAME.players[GAME.currentPlayerIdx]};
  let players = [...GAME.players];
  let properties = {...GAME.properties};
  let log = [...GAME.log];
  const nextPhase = GAME.turnDoublesCount > 0 ? "roll" : "end";
  
  if (shouldBuy && player.balance >= space.price) {
    player.balance -= space.price;
    properties[space.id] = player.id;
    players = GAME.players.map((p, i) => i === GAME.currentPlayerIdx ? player : p);
    log = ["🏠 " + player.token + " compró " + space.name + " por " + formatMoney(space.price), ...log].slice(0, 40);
  } else {
    log = ["⏭️ " + player.token + " no compró " + space.name, ...log].slice(0, 40);
    const auction = runAuction(space, players, properties);
    players = auction.players;
    properties = auction.properties;
    log = [auction.logMessage, ...log].slice(0, 40);
  }
  
  GAME = {...GAME, players, properties, gamePhase: nextPhase, pending: null, log};
  render();
}

function processEndTurn() {
  const activePlayers = GAME.players.filter(p => !p.bankrupt);
  if (activePlayers.length <= 1) return;
  
  let nextIdx = (GAME.currentPlayerIdx + 1) % GAME.players.length;
  while (GAME.players[nextIdx].bankrupt) {
    nextIdx = (nextIdx + 1) % GAME.players.length;
  }
  
  const isNewRound = nextIdx <= GAME.currentPlayerIdx;
  const newRound = isNewRound ? GAME.round + 1 : GAME.round;
  
  let ecoData = GAME.ecoData;
  let playerRoundBalances = GAME.playerRoundBalances;
  let coeffs = GAME.polyCoeffs;
  let multiplier = GAME.inflationMultiplier;
  let log = GAME.log;
  
  // Actualizar modelo económico al inicio de nueva ronda
  if (isNewRound) {
    const {newEcoData, coeffs: newCoeffs, multiplier: newMult} = 
      updateEconomicModel(GAME.players, newRound, GAME.ecoData);
    
    ecoData = newEcoData;
    coeffs = newCoeffs;
    multiplier = newMult;
    
    log = [
      "📊 Ronda " + newRound + " — Inflación ×" + multiplier.toFixed(2) + 
      " | p(x) ajustado con " + ecoData.length + " puntos",
      ...log
    ].slice(0, 40);

    // Snapshot de saldo para comparar cambios durante la nueva ronda
    playerRoundBalances = GAME.players.reduce((acc, p) => {
      acc[p.id] = p.balance;
      return acc;
    }, {});
  }
  
  GAME = {
    ...GAME,
    currentPlayerIdx: nextIdx,
    gamePhase: "roll",
    diceRoll: null,
    turnDoublesCount: 0,
    round: newRound,
    ecoData,
    playerRoundBalances,
    polyCoeffs: coeffs,
    inflationMultiplier: multiplier,
    log
  };
  
  render();
}

    if (GAME.polyCoeffs) {
      for (let r = 1; r <= maxRound; r += 0.3) {
        const y = polynomialEval(GAME.polyCoeffs, r);
        curvePts += toX(r) + ',' + toY(y) + ' ';
      }
    }
    
    chartHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <line x1="15" x2="${W-15}" y1="${H-10}" y2="${H-10}" stroke="#475569" stroke-width="1"/>
      ${[0.33, 0.66, 1].map(t => `
        <line x1="15" x2="${W-15}" y1="${toY(minY + t * (maxY - minY))}" 
              y2="${toY(minY + t * (maxY - minY))}" stroke="#334155" stroke-width="0.5"/>
      `).join('')}
      ${curvePts ? `<polyline points="${curvePts}" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>` : ''}
      ${GAME.polyCoeffs ? `<line x1="${toX(GAME.round)}" x2="${toX(GAME.round)}" y1="4" y2="${H-10}" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>` : ''}
      ${GAME.ecoData.map(([r, v]) => `<circle cx="${toX(r)}" cy="${toY(v)}" r="3" fill="#ef4444" opacity="0.9"/>`).join('')}
      <text x="18" y="${H-2}" font-size="8" fill="#60a5fa">p(x)</text>
      <text x="55" y="${H-2}" font-size="8" fill="#ef4444">datos</text>
    </svg>
    `;
  }
  
  const numPanel = SHOW_NUMERIC_METHOD ? `
  <div class="card num-method" style="margin-bottom: 12px;">
    <div class="num-method-header">
      <h2 style="margin: 0;">Ajuste Polinomial</h2>
      <span class="tag ${GAME.polyCoeffs ? 'tag-success' : 'tag-warning'}">

      </div>
      <div class="panel">

      </div>
      <div class="panel">
        <div class="sec" style="font-size: 10px; margin-bottom: 4px;">Ronda actual</div>

    <div class="panel" style="margin-bottom: 10px; border-left: 3px solid #0ea5e9;">
      <p style="font-size: 11px; line-height: 1.6;">
        <strong>Riqueza promedio actual:</strong> ${formatMoney(Math.round(avgWealthNow))}
        <span style="color: ${avgDeltaPct < 0 ? '#ef4444' : avgDeltaPct > 0 ? '#10b981' : '#94a3b8'};">
          (${avgDeltaPct >= 0 ? '+' : ''}${avgDeltaPct.toFixed(1)}% vs última captura)
        </span><br>
        <strong>Leyenda de renta:</strong> base ${formatMoney(sampleBaseRent)} → ajustada ${formatMoney(sampleAdjustedRent)} 
        <span style="color: #f59e0b;">(${sampleImpactPct >= 0 ? '+' : ''}${sampleImpactPct.toFixed(1)}%)</span>
      </p>
    </div>
    
    ${GAME.polyCoeffs ? `
    <div class="coefficient-display">
      p(x) = ${GAME.polyCoeffs[0].toFixed(0)} + ${GAME.polyCoeffs[1].toFixed(0)}·x + ${GAME.polyCoeffs[2].toFixed(0)}·x²
    </div>
    ` : ''}
    
    ${GAME.ecoData.length >= 2 ? chartHTML : `
    <p class="sec" style="text-align: center; padding: 12px 0;">
      Necesita ${3 - GAME.ecoData.length} ronda(s) más para ajustar la curva.
    </p>
    `}
    
    <div class="panel" style="margin-top: 10px; border-left: 3px solid #3b82f6;">
      <p style="font-size: 11px; line-height: 1.6;">
        <strong>Alimentación:</strong> Al completar cada ronda se captura 
        (ronda, riqueza_promedio_activos).<br>
        <strong>Resolución:</strong> Con ≥3 puntos se resuelve AᵀA·c = Aᵀb 
        mediante Eliminación Gaussiana con pivoteo.<br>
        <strong>Resultado:</strong> inflator = p(ronda)/p(1), acotado [1.0, 2.5]. 
        Multiplica rentas.
      </p>
    </div>
  </div>
  ` : '';
  
  return `
  <div style="padding: 8px;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
      <h2 style="margin: 0;">🏦 Monopoly BE</h2>
      <span class="tag tag-success">Ronda ${GAME.round}</span>
      <span class="tag tag-${infColor}">Inflación ×${GAME.inflationMultiplier.toFixed(2)}</span>
      <button onclick="toggleNumeric()" class="btn" style="margin-left: auto; font-size: 11px;">
        ${SHOW_NUMERIC_METHOD ? 'Ocultar' : 'Ver'} método

    </div>
    
    ${numPanel}
    
    <div class="game-container">
      <div>
        <div class="card" style="margin-bottom: 10px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-color: #1d4ed8;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
            <div>
              <div class="sec" style="font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;">Banco Electrónico</div>
              <div style="font-size: 18px; font-weight: 600; margin-top: 2px;">Cuenta activa: ${cur.token} ${cur.name}</div>
            </div>
            <div style="text-align: right;">
              <div class="sec" style="font-size: 10px;">Saldo disponible</div>
              <div style="font-size: 22px; font-weight: 700; color: ${getBalanceColor(cur)};">${formatMoney(cur.balance)}</div>
              <div class="sec" style="font-size: 10px; margin-top: 2px;">
                Δ ronda: ${getBalanceDelta(cur) >= 0 ? '+' : ''}${formatMoney(getBalanceDelta(cur))}
              </div>
            </div>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;">
            <span class="tag tag-success">Propiedades: ${ownedByCurrent.length}</span>
            <span class="tag tag-warning">Cartas cárcel: ${cur.jailFreeCards || 0}</span>
            <span class="tag tag-${infColor}">Inflación ×${GAME.inflationMultiplier.toFixed(2)}</span>
          </div>
        </div>

        ${boardHTML}
        
        <div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
          ${GAME.players.map(p => `
          <span style="font-size: 11px; display: flex; align-items: center; gap: 6px; opacity: ${p.bankrupt ? 0.4 : 1};">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: ${p.color};"></span>
            ${p.token} ${p.name}: <strong>${p.bankrupt ? '💥' : formatMoney(p.balance)}</strong>
            ${!p.bankrupt ? `<span class="sec">(${BOARD[p.pos].name})</span>` : ''}
          </span>
          `).join('')}
        </div>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="card">
          <h2 style="margin-top: 0;">Turno Actual</h2>
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: ${cur.color};"></span>
            <span style="font-weight: 600;">${cur.token} ${cur.name}</span>
          </div>
          <div style="font-size: 18px; font-weight: 600; color: #10b981; margin-bottom: 6px;">
            ${formatMoney(cur.balance)}
          </div>
          <div style="font-size: 11px; margin-bottom: 6px; color: ${getBalanceColor(cur)};">
            Δ ronda: ${getBalanceDelta(cur) >= 0 ? '+' : ''}${formatMoney(getBalanceDelta(cur))}
          </div>
          <div class="sec" style="margin-bottom: 6px;">${BOARD[cur.pos].name}</div>
          <div class="sec" style="margin-bottom: 6px; font-size: 11px;">Cartas cárcel: ${cur.jailFreeCards || 0}</div>
          ${cur.inJail ? `<div style="color: #ef4444; font-size: 11px;">🔒 En cárcel (${cur.jailTurns}/3)</div>` : ''}
          ${cur.inJail && (cur.jailFreeCards || 0) > 0 ? `<button onclick="useJailFreeCard()" class="btn btn-warning" style="margin-top: 8px; width: 100%;">Usar carta de salida</button>` : ''}
        </div>
        
        ${GAME.diceRoll ? `
        <div class="card" style="display: flex; justify-content: center; gap: 12px;">
          ${GAME.diceRoll.map(d => `
            <div style="width: 48px; height: 48px; background: #334155; border-radius: 4px;
                        display: flex; align-items: center; justify-content: center;
                        font-size: 24px; font-weight: 600; border: 1px solid #475569;">
              ${d}
            </div>
          `).join('')}
        </div>
        ` : ''}
        
        <div style="display: flex; gap: 8px; flex-direction: column;">
          ${GAME.gamePhase === 'roll' ? `
            <button onclick="roll()" class="btn btn-primary" style="padding: 10px; font-size: 14px;">
              🎲 Lanzar Dados
            </button>
          ` : ''}
          
          ${GAME.gamePhase === 'buy_prompt' && GAME.pending ? `
            <div class="panel" style="border-left: 3px solid #f59e0b;">
              <p style="font-weight: 600; margin-bottom: 6px;">¿Comprar?</p>
              <p class="sec" style="margin-bottom: 4px;">${GAME.pending.name}</p>
              <p style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">
                ${formatMoney(GAME.pending.price)}
              </p>
              <div style="display: flex; gap: 6px;">
                <button onclick="buyProp(true)" class="btn btn-success" style="flex: 1;">Comprar</button>
                <button onclick="buyProp(false)" class="btn" style="flex: 1;">Pasar</button>
              </div>
            </div>
          ` : ''}
          
          ${GAME.gamePhase === 'end' ? `
            <button onclick="endTurn()" class="btn" style="padding: 10px;">
              Terminar Turno →
            </button>
          ` : ''}
        </div>
        
        <div class="panel" style="border-left: 3px solid #334155;">
          <h2 style="margin-top: 0; margin-bottom: 10px;">Jugadores</h2>
          ${GAME.players.map(p => `
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px; opacity: ${p.bankrupt ? 0.4 : 1};">
              <span style="font-size: 14px;">${p.token}</span>
              <span style="flex: 1; font-size: 11px;">${p.name}</span>
              <span style="font-size: 11px; font-weight: 600; color: ${p.bankrupt ? '#ef4444' : getBalanceColor(p)};">
                ${p.bankrupt ? '💥' : formatMoney(p.balance)}
              </span>
              <span style="font-size: 10px; color: ${p.bankrupt ? '#ef4444' : getBalanceColor(p)}; min-width: 58px; text-align: right;">
                ${p.bankrupt ? '' : (getBalanceDelta(p) >= 0 ? '+' : '') + formatMoney(getBalanceDelta(p))}
              </span>
            </div>
          `).join('')}
        </div>

        <div class="panel" style="border-left: 3px solid #2563eb;">
          <h2 style="margin-top: 0; margin-bottom: 10px;">Mis Propiedades</h2>
          ${ownedByCurrent.length ? ownedByCurrent.map(space => `
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: ${space.color || '#64748b'};"></span>
              <span style="flex: 1; font-size: 11px;">${space.name}</span>
              <span style="font-size: 10px; color: #94a3b8;">${GAME.mortgaged[space.id] ? 'Hipotecada' : 'Libre'}</span>
              ${space.type !== 'tax' && space.type !== 'chance' && space.type !== 'comm' && space.type !== 'go' && space.type !== 'jail' && space.type !== 'park' && space.type !== 'jail2' ? `
                <button onclick="toggleMortgage(${space.id})" class="btn" style="padding: 3px 8px; font-size: 10px;">${GAME.mortgaged[space.id] ? 'Levantar' : 'Hipotecar'}</button>
              ` : ''}
            </div>
          `).join('') : '<p class="sec" style="font-size: 11px;">Aún no tienes propiedades.</p>'}
        </div>
        
        <div class="panel scroll" style="border-left: 3px solid #334155;">
          <h2 style="margin-top: 0; margin-bottom: 8px;">Registro</h2>
          <div class="sec" style="font-size: 10px; margin-bottom: 6px;">Eventos del banco, compras, rentas y tarjetas</div>
          ${GAME.log.map(entry => `
            <div class="log-entry">${entry}</div>
          `).join('')}
        </div>
      </div>
    </div>
    
    <!-- Modal de Carta -->
    ${SHOW_CARD_MODAL && CURRENT_CARD ? `
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999;">
      <div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 2px solid #3b82f6; border-radius: 12px; padding: 30px; max-width: 400px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8);">
        <div style="font-size: 28px; margin-bottom: 10px;">${CURRENT_CARD.type}</div>
        <h2 style="color: #60a5fa; margin: 15px 0; font-size: 20px;">${CURRENT_CARD.text}</h2>
        <p class="sec" style="margin: 20px 0; font-size: 12px;">Presiona el botón para continuar</p>
        <button id="card-modal-accept-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px; font-weight: 600;">
          Aceptar
        </button>
      </div>

    ` : ''}
  </div>
  `;
}

function bindSetup() {}
function bindGame() {}
function bindGameOver() {}

// Event handlers
window.selectPlayers = function(n) {
  NUM_PLAYERS = n;
  render();
};

window.startGame = function() {
  GAME = initGame(NUM_PLAYERS);
  SCREEN = "game";
  render();
};

window.goSetup = function() {
  SCREEN = "setup";
  GAME = null;
  render();
};

window.roll = function() {
  processRoll();
};

window.buyProp = function(shouldBuy) {
  processBuy(shouldBuy);
};

window.endTurn = function() {
  processEndTurn();
};

window.toggleNumeric = function() {
  SHOW_NUMERIC_METHOD = !SHOW_NUMERIC_METHOD;
  render();
};

window.useJailFreeCard = function() {
  const currentPlayer = {...GAME.players[GAME.currentPlayerIdx]};
  if (!currentPlayer.inJail || !(currentPlayer.jailFreeCards || 0)) return;
  const updatedPlayer = useJailFreeCard(currentPlayer);
  const players = GAME.players.map(player => player.id === updatedPlayer.id ? updatedPlayer : player);
  const log = [updatedPlayer.token + " usó una carta de salida de cárcel.", ...GAME.log].slice(0, 40);
  GAME = {...GAME, players, log};
  render();
};

window.toggleMortgage = function(spaceId) {
  if (!GAME) return;
  const currentPlayer = {...GAME.players[GAME.currentPlayerIdx]};
  const ownerId = GAME.properties[spaceId];
  if (ownerId !== currentPlayer.id) return;

  const space = getSpaceById(spaceId);
  const mortgaged = {...GAME.mortgaged};
  let players = [...GAME.players];
  let log = [...GAME.log];

  if (!mortgaged[spaceId]) {
    const value = Math.round(space.price / 2);
    mortgaged[spaceId] = true;
    currentPlayer.balance += value;
    players = players.map(player => player.id === currentPlayer.id ? currentPlayer : player);
    log = ["🏦 " + currentPlayer.token + " hipotecó " + space.name + " y recibió " + formatMoney(value), ...log].slice(0, 40);
  } else {
    const cost = Math.round((space.price / 2) * 1.1);
    if (currentPlayer.balance < cost) {
      log = ["⏭️ " + currentPlayer.token + " no tiene saldo para levantar la hipoteca de " + space.name, ...log].slice(0, 40);
      GAME = {...GAME, log};
      render();
      return;
    }
    mortgaged[spaceId] = false;
    currentPlayer.balance -= cost;
    players = players.map(player => player.id === currentPlayer.id ? currentPlayer : player);
    log = ["🏦 " + currentPlayer.token + " levantó la hipoteca de " + space.name + " por " + formatMoney(cost), ...log].slice(0, 40);
  }

  GAME = {...GAME, players, mortgaged, log};
  render();
};

window.resolveCardModal = function() {
  if (!CURRENT_CARD || !GAME || GAME.gamePhase !== "card_modal") return;
  
  let player = {...GAME.players[GAME.currentPlayerIdx]};
  let players = [...GAME.players];
  let log = [...GAME.log];
  const d1 = GAME.diceRoll[0];
  const d2 = GAME.diceRoll[1];
  const isDouble = d1 === d2;
  const doublesCount = GAME.turnDoublesCount || 0;
  const nextPhase = isDouble && doublesCount < 3 ? "roll" : "end";
  
  const addLog = msg => { log = [msg, ...log].slice(0, 40); };
  
  addLog(CURRENT_CARD.type + ": \"" + CURRENT_CARD.text + "\"");
  
  const newPlayer = CURRENT_CARD.action(player);
  const updatedPlayer = {...player, ...newPlayer};
  
  if (updatedPlayer.pos !== player.pos) {
    const resolved = resolveLandingAfterMove(updatedPlayer, players, log, CURRENT_CARD.type);
    players = resolved.players;
    log = resolved.log;
    const finalPhase = resolved.gamePhase || nextPhase;
    const finalDoublesCount = resolved.turnDoublesCount ?? doublesCount;
    GAME = {...GAME, players, log, gamePhase: finalPhase, turnDoublesCount: finalDoublesCount, pending: resolved.pending ?? null};
  } else {
    players[GAME.currentPlayerIdx] = updatedPlayer;
    if (updatedPlayer.balance < 0) {
      players = players.map(pl => pl.id === updatedPlayer.id ? {...pl, bankrupt: true} : pl);
      addLog("💥 " + updatedPlayer.token + " ¡BANCARROTA!");
    }
    GAME = {...GAME, players, log, gamePhase: nextPhase, turnDoublesCount: doublesCount};
  }
  
  SHOW_CARD_MODAL = false;
  CURRENT_CARD = null;
  render();
};

// Event delegation para modal de cartas (persiste a través de renders)
document.addEventListener("click", (e) => {
  if (e.target && e.target.id === "card-modal-accept-btn") {
    resolveCardModal();
  }
});

// Initial render
render();
</script>
